<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>E-Book авторизация</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <div class="auth-card">
    
    <img class="back-img" src="background.svg">
    <div class="left">
      <img src="books.svg" alt="books">
    </div>

    <div class="right">
      <h2>Добро пожаловать!</h2>
      <p class="subtitle">Войдите в аккаунт</p>

      <form>
        <input type="text" placeholder="Введите имя или почту">
        <input type="password" placeholder="Введите пароль">

        <button>Войти в аккаунт</button>
      </form>

      <p class="link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </div>

  </div>
</div>

</body>
</html>
