<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>E-Book авторизация</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='general_images/e-book-icon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='register_login/style.css') }}">
</head>
<body>

<div class="wrapper">
  <div class="auth-card">
    <img class="back-img" src="{{ url_for('static', filename='register_login/images/background.svg') }}">
    <div class="left">
      <img src="{{ url_for('static', filename='register_login/images/books.svg') }}" alt="books">
    </div>

    <div class="right">
      <h2>Добро пожаловать!</h2>
      <p class="subtitle">Войдите в аккаунт</p>

      <form action="{{ url_for('auth_login.login') }}" method="POST">
        <input type="text" name="login" placeholder="Введите имя или почту"
               value="{{ form_data.login }}" required>

        <input type="password" name="password" placeholder="Введите пароль" required>

        <button type="submit">Войти в аккаунт</button>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <p class="error-message">{{ message }}</p>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </form>

      <p class="link">Нет аккаунта? <a href="{{ url_for('auth_reg.register') }}">Зарегистрироваться</a></p>
    </div>
  </div>
</div>

</body>
</html>
